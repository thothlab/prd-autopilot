<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>prd</title>
<style>
  :root{
    --bg:#f7f7f5; --card:#ffffff; --ink:#1a1a19; --dim:#6b6b66; --line:#e3e3de;
    --accent:#1f6f5c; --warn:#b4581a; --bad:#b3372c; --good:#2f7a44; --busy:#c58a12;
    --track:#eceae5; --shadow:0 1px 2px rgba(0,0,0,.05);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#16171a; --card:#1e2024; --ink:#e8e8e4; --dim:#9a9a94; --line:#2e3136;
      --accent:#4fb495; --warn:#e0954a; --bad:#e0685c; --good:#63c07e; --busy:#e0b04a;
      --track:#282b30; --shadow:none;
    }
  }
  :root[data-theme="dark"]{
    --bg:#16171a; --card:#1e2024; --ink:#e8e8e4; --dim:#9a9a94; --line:#2e3136;
    --accent:#4fb495; --warn:#e0954a; --bad:#e0685c; --good:#63c07e; --busy:#e0b04a;
    --track:#282b30; --shadow:none;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);padding:30px 18px 70px;
    font:15px/1.5 ui-sans-serif,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
    -webkit-font-smoothing:antialiased}
  .wrap{max-width:1020px;margin:0 auto;min-width:0}
  .top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:6px}
  .mark{font-size:34px;font-weight:700;letter-spacing:-.035em;line-height:1}
  .mark span{color:var(--accent)}
  .segs{margin-left:auto;display:flex;gap:8px}
  .seg{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
  .seg button{appearance:none;border:0;background:transparent;color:var(--dim);cursor:pointer;
    font:600 11px/1 inherit;letter-spacing:.07em;padding:8px 11px}
  .seg button:hover{color:var(--ink)}
  .seg button[aria-pressed="true"]{background:var(--accent);color:var(--bg)}
  h1{font-size:18px;font-weight:600;margin:0 0 4px;letter-spacing:-.01em}
  h2{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.1em;
    color:var(--dim);margin:30px 0 10px}
  .badges{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 20px}
  .badge{font-size:11px;font-weight:600;letter-spacing:.03em;padding:4px 9px;border-radius:999px;
    border:1px solid var(--line);color:var(--dim);background:var(--card)}
  .badge.on{border-color:transparent;background:var(--accent);color:var(--bg)}
  .headline{background:var(--card);border:1px solid var(--line);border-radius:14px;
    padding:18px 20px;box-shadow:var(--shadow);margin-bottom:14px}
  .headline .n{font-size:34px;font-weight:700;letter-spacing:-.02em;line-height:1.1}
  .bar{height:7px;border-radius:99px;background:var(--track);overflow:hidden;margin:12px 0 8px}
  .bar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .4s}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;
    box-shadow:var(--shadow);min-width:0}
  .k{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--dim)}
  .v{font-size:23px;font-weight:650;letter-spacing:-.01em;margin-top:5px;overflow-wrap:anywhere}
  .sub{font-size:12.5px;color:var(--dim);margin-top:4px;overflow-wrap:anywhere}
  .stage{display:flex;align-items:baseline;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
  .stage:last-child{border-bottom:0}
  .dot{width:8px;height:8px;border-radius:99px;background:var(--track);flex:0 0 auto;
    align-self:center;border:1px solid var(--line)}
  .dot.done{background:var(--good);border-color:transparent}
  .dot.active{background:var(--busy);border-color:transparent;animation:pulse 1.6s infinite}
  .dot.skipped{background:var(--track);border-style:dashed}
  .dot.failed{background:var(--bad);border-color:transparent}
  @keyframes pulse{50%{opacity:.35}}
  .stage .nm{font-weight:550}
  .stage .rest{margin-left:auto;font-size:12.5px;color:var(--dim);text-align:right}
  .wave{margin:14px 0 4px;font-size:12px;color:var(--dim);font-weight:600;letter-spacing:.04em}
  .task{display:flex;align-items:center;gap:10px;padding:7px 0}
  .track{flex:1 1 auto;height:26px;border-radius:7px;background:var(--track);position:relative;
    overflow:hidden;min-width:0}
  .track.pending{background:transparent;border:1px dashed var(--line)}
  .fill{position:absolute;inset:0;width:100%;opacity:.16}
  .fill.done{background:var(--good)} .fill.inprogress{background:var(--busy)}
  .fill.review{background:var(--accent)} .fill.repair{background:var(--warn)}
  .fill.failed{background:var(--bad)}
  .track .lbl{position:relative;display:flex;align-items:center;gap:8px;height:100%;
    padding:0 10px;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .track .phase{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;
    color:var(--dim);flex:0 0 auto}
  .task .t{flex:0 0 auto;font-size:12.5px;color:var(--dim);font-variant-numeric:tabular-nums;
    min-width:62px;text-align:right}
  .num{flex:0 0 auto;font-size:12px;color:var(--dim);font-variant-numeric:tabular-nums;width:22px}
  .scroll{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--card)}
  table{border-collapse:collapse;width:100%;font-size:13.5px}
  th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
  th{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--dim);font-weight:600}
  tr:last-child td{border-bottom:0}
  td.wrapcell{white-space:normal;min-width:200px}
  ul.plain{list-style:none;margin:0;padding:0}
  ul.plain li{padding:5px 0;border-bottom:1px solid var(--line);font-size:13.5px;overflow-wrap:anywhere}
  ul.plain li:last-child{border-bottom:0}
  .empty{color:var(--dim);font-size:13.5px}
  .foot{margin-top:34px;padding-top:14px;border-top:1px solid var(--line);
    display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--dim)}
  .foot .stale{color:var(--warn);font-weight:600}
  code{font:12.5px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace;background:var(--track);
    padding:1px 5px;border-radius:5px}
  .miss{max-width:560px;margin:70px auto;text-align:center;color:var(--dim)}
</style>

<div class="wrap" id="app"></div>

<script src="state.js"></script>
<script>
"use strict";

/* ---------- словарь ---------- */
const DICT = {
  ru:{
    code:"ru", none:"—", empty:"пусто",
    progress:"Прогресс", progressSub:(a,b)=>`пройдено этапов ${a} из ${b}`,
    coverage:"Покрытие запроса", coverageSub:(d,f,p)=>`снято ${d} · отложено ${f} · заглушек ${p}`,
    reqOf:(a,b)=>`закрыто ${a} из ${b} требований`,
    stageNow:"Этап сейчас", elapsed:"Прошло", left:"Осталось (оценка)",
    early:"рано считать", needTwo:"нужно 2 закрытых задачи",
    critpath:n=>`критический путь: ${n} в цепочке`,
    tasks:"Задачи", tasksSub:p=>`${p}% готово`,
    noSplit:"без разбивки", notCut:"ещё не нарезаны",
    debt:"Долг", debtSub:(a,b,c)=>`заглушек ${a} · решений за тебя ${b} · переменных ${c}`,
    tests:"Тесты", testsSub:"последний полный прогон", failed:n=>`упало ${n}`,
    stages:"Этапы", flow:"Ход работы", table:"Задачи — детально",
    stageName:{preflight:"Подготовка",manifest:"Требования",briefing:"Брифинг",
      spec:"PRD и спеки",plan:"План задач",build:"Разработка",review:"Код-ревью",final:"Приёмка"},
    st:{pending:"не начат",active:"идёт",done:"пройден",skipped:"пропущен",failed:"остановлен"},
    phase:{"in-progress":"пишется",review:"ревью",repair:"ремонт"},
    tstatus:{pending:"ждёт","in-progress":"пишется",review:"на ревью",repair:"в ремонте",
      done:"готово",failed:"упало"},
    wave:(n,c)=>c>1?`Волна ${n} — ${c} задач параллельно`:`Волна ${n}`,
    chip:{done:n=>`готово ${n}`,"in-progress":n=>`пишутся ${n}`,review:n=>`на ревью ${n}`,
      repair:n=>`в ремонте ${n}`,pending:n=>`ждут ${n}`,failed:n=>`упало ${n}`},
    nowLbl:"Сейчас:", nowIdle:"Ни одна задача не запущена.",
    g2:(f,x)=>`сверка: найдено ${f}, закрыто ${x}`,
    onePass:"Один заход — ярус T0, без разбивки на задачи",
    noTasks:"Задач пока нет — идёт подготовка.",
    thN:"#", thTitle:"Задача", thReq:"Требования", thState:"Статус", thTime:"Время",
    thRetry:"Повт.", thTests:"Тесты", thCommit:"Коммит",
    toClose:"Что осталось закрыть", placeholders:"Заглушки — нужны твои данные",
    assumptions:"Решения, принятые за тебя", envVars:"Переменные окружения",
    additions:"Добавлено сверх заказанного", concerns:"Отложенные замечания",
    blind:"Слепая приёмка", blindOk:"Расхождений нет.", blindBad:"Расхождения:",
    blindV:(m,c)=>`${m} из ${c} требований подтверждено`,
    polish:"Доводка", polishSub:(r,f)=>`кругов ${r} · различий устранено ${f}`,
    updated:"Обновлено", filesIn:"Документы —", branch:"Ветка",
    finished:"Работа закончена", mode:"режим", depth:"глубина",
    modes:{full:"полный автомат",semi:"полуавтомат",interview:"интервью",manual:"ручной"},
    depths:{strict:"строго по запросу",normal:"обычная глубина",deep:"максимальная глубина"},
    polishBadge:"доводка", tier:t=>`ярус ${t}`,
    autoOn:"Автообновление включено", autoOff:"Автообновление выключено",
    themeLight:"Светлая тема", themeDark:"Тёмная тема",
    secs:n=>`${n} сек`, mins:n=>`${n} мин`, hrs:(h,m)=>`${h} ч ${m} мин`,
    agoS:n=>`${n} сек назад`, agoM:n=>`${n} мин назад`, agoH:(h,m)=>`${h} ч ${m} мин назад`,
    noState:"Состояние ещё не прочитано",
    noStateWhy:"Файл <code>state.js</code> не загрузился или не присвоил <code>window.STATE</code>. " +
      "Если работа только началась — он появится сам."
  },
  en:{
    code:"en", none:"—", empty:"none",
    progress:"Progress", progressSub:(a,b)=>`${a} of ${b} stages done`,
    coverage:"Request coverage", coverageSub:(d,f,p)=>`dropped ${d} · deferred ${f} · stubs ${p}`,
    reqOf:(a,b)=>`${a} of ${b} requirements closed`,
    stageNow:"Current stage", elapsed:"Elapsed", left:"Remaining (estimate)",
    early:"too early", needTwo:"needs 2 finished tasks",
    critpath:n=>`critical path: ${n} deep`,
    tasks:"Tasks", tasksSub:p=>`${p}% done`,
    noSplit:"no split", notCut:"not cut yet",
    debt:"Debt", debtSub:(a,b,c)=>`stubs ${a} · assumptions ${b} · variables ${c}`,
    tests:"Tests", testsSub:"last full run", failed:n=>`${n} failed`,
    stages:"Stages", flow:"Progress", table:"Tasks — detail",
    stageName:{preflight:"Preflight",manifest:"Requirements",briefing:"Briefing",
      spec:"PRD & specs",plan:"Task plan",build:"Development",review:"Code review",final:"Acceptance"},
    st:{pending:"not started",active:"running",done:"done",skipped:"skipped",failed:"stopped"},
    phase:{"in-progress":"writing",review:"review",repair:"repair"},
    tstatus:{pending:"waiting","in-progress":"writing",review:"in review",repair:"in repair",
      done:"done",failed:"failed"},
    wave:(n,c)=>c>1?`Wave ${n} — ${c} tasks in parallel`:`Wave ${n}`,
    chip:{done:n=>`done ${n}`,"in-progress":n=>`writing ${n}`,review:n=>`in review ${n}`,
      repair:n=>`in repair ${n}`,pending:n=>`waiting ${n}`,failed:n=>`failed ${n}`},
    nowLbl:"Now:", nowIdle:"No task is running.",
    g2:(f,x)=>`coverage check: found ${f}, closed ${x}`,
    onePass:"Single pass — tier T0, no task split",
    noTasks:"No tasks yet — still preparing.",
    thN:"#", thTitle:"Task", thReq:"Requirements", thState:"Status", thTime:"Time",
    thRetry:"Retry", thTests:"Tests", thCommit:"Commit",
    toClose:"Still open", placeholders:"Stubs — your data needed",
    assumptions:"Decided for you", envVars:"Environment variables",
    additions:"Added beyond the request", concerns:"Deferred findings",
    blind:"Blind acceptance", blindOk:"No disagreements.", blindBad:"Disagreements:",
    blindV:(m,c)=>`${m} of ${c} requirements confirmed`,
    polish:"Polish", polishSub:(r,f)=>`rounds ${r} · differences fixed ${f}`,
    updated:"Updated", filesIn:"Documents —", branch:"Branch",
    finished:"Finished", mode:"mode", depth:"depth",
    modes:{full:"fully automatic",semi:"semi-automatic",interview:"interview",manual:"manual"},
    depths:{strict:"strict",normal:"normal depth",deep:"maximum depth"},
    polishBadge:"polish", tier:t=>`tier ${t}`,
    autoOn:"Auto-refresh on", autoOff:"Auto-refresh off",
    themeLight:"Light theme", themeDark:"Dark theme",
    secs:n=>`${n} s`, mins:n=>`${n} min`, hrs:(h,m)=>`${h} h ${m} min`,
    agoS:n=>`${n} s ago`, agoM:n=>`${n} min ago`, agoH:(h,m)=>`${h} h ${m} min ago`,
    noState:"State not read yet",
    noStateWhy:"<code>state.js</code> did not load or did not assign <code>window.STATE</code>. " +
      "If the run just started it will appear on its own."
  }
};

const STAGE_ORDER = ["preflight","manifest","briefing","spec","plan","build","review","final"];
const STAGE_WEIGHT = {preflight:3,manifest:5,briefing:7,spec:15,plan:8,build:40,review:12,final:10};

/* ---------- настройки страницы ---------- */
function store(k, v){
  try {
    if (v !== undefined) localStorage.setItem(k, v);
    return localStorage.getItem(k);
  } catch (e) { return null; }
}
let lang = (store("prd-lang") === "en") ? "en" : "ru";
let theme = store("prd-theme") || "system";
let auto = store("prd-auto") !== "off";
let L = DICT[lang];

function applyTheme(){
  if (theme === "system") document.documentElement.removeAttribute("data-theme");
  else document.documentElement.setAttribute("data-theme", theme);
}
function currentTheme(){
  if (theme !== "system") return theme;
  return matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
}

/* ---------- мелочи ---------- */
const esc = s => String(s == null ? "" : s)
  .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const at = s => { const d = s ? new Date(s) : null; return d && !isNaN(d) ? d.getTime() : null; };
const pct = (a, b) => b > 0 ? Math.max(0, Math.min(100, Math.round(a / b * 100))) : 0;

function dur(ms){
  if (ms == null || isNaN(ms) || ms < 0) return L.none;
  const s = Math.floor(ms / 1000);
  if (s < 90) return L.secs(s);
  const m = Math.round(s / 60);
  if (m < 60) return L.mins(m);
  return L.hrs(Math.floor(m / 60), m % 60);
}
function ago(ms){
  const s = Math.floor(ms / 1000);
  if (s < 90) return L.agoS(Math.max(0, s));
  const m = Math.round(s / 60);
  if (m < 60) return L.agoM(m);
  return L.agoH(Math.floor(m / 60), m % 60);
}
/* живые интервалы дорисовываются раз в секунду — так перерисовка не сбрасывает выделение текста */
const live = (from, to) => `<span data-from="${esc(from || "")}" data-to="${esc(to || "")}">${
  from ? dur((to ? at(to) : Date.now()) - at(from)) : L.none}</span>`;

/* ---------- расчёты ---------- */
function stageMap(S){
  const m = {};
  (S.stages || []).forEach(s => { m[s.id] = s; });
  return m;
}
function taskShare(S){
  const T = S.tickets || [];
  if (!T.length) return (S.singlePass && S.singlePass.finishedAt) ? 1 : 0;
  const done = T.filter(t => t.status === "done").length;
  const half = T.filter(t => t.status === "review" || t.status === "repair").length;
  return (done + half * 0.5) / T.length;
}
function overall(S){
  const m = stageMap(S), share = taskShare(S);
  let got = 0, all = 0;
  STAGE_ORDER.forEach(id => {
    const w = STAGE_WEIGHT[id];
    all += w;
    const st = m[id];
    if (!st) return;
    if (st.status === "done" || st.status === "skipped") got += w;
    else if (st.status === "active") got += w * ((id === "build" || id === "review") ? share : 0.5);
  });
  return pct(got, all);
}
/* сколько задач ещё стоит в самой длинной цепочке зависимостей */
function criticalPath(S){
  const T = S.tickets || [];
  const left = T.filter(t => t.status !== "done" && t.status !== "failed");
  if (!left.length) return 0;
  const by = {};
  T.forEach(t => { by[t.id] = t; });
  const memo = {};
  const depth = id => {
    if (memo[id] != null) return memo[id];
    memo[id] = 1;
    const t = by[id];
    const ups = ((t && t.blockedBy) || []).filter(b => by[b] && by[b].status !== "done");
    memo[id] = 1 + ups.reduce((mx, b) => Math.max(mx, depth(b)), 0);
    return memo[id];
  };
  return left.reduce((mx, t) => Math.max(mx, depth(t.id)), 0);
}
function medianTask(S){
  const spans = (S.tickets || [])
    .filter(t => t.startedAt && t.finishedAt)
    .map(t => at(t.finishedAt) - at(t.startedAt))
    .filter(v => v > 0)
    .sort((a, b) => a - b);
  if (spans.length < 2) return null;
  const mid = Math.floor(spans.length / 2);
  return spans.length % 2 ? spans[mid] : (spans[mid - 1] + spans[mid]) / 2;
}

/* ---------- куски разметки ---------- */
function card(k, v, sub){
  return `<div class="card"><div class="k">${k}</div><div class="v">${v}</div>` +
    (sub ? `<div class="sub">${sub}</div>` : "") + "</div>";
}
function list(items){
  if (!items || !items.length) return `<div class="empty">${L.empty}</div>`;
  return `<ul class="plain">${items.map(i => `<li>${esc(i)}</li>`).join("")}</ul>`;
}
function stageRow(S, id){
  const st = stageMap(S)[id] || { status: "pending" };
  const time = st.startedAt ? live(st.startedAt, st.finishedAt) : "";
  let note = st.note ? esc(st.note) : (L.st[st.status] || "");
  /* результат независимой сверки виден там, где её проводили, — иначе о ней никто не узнает */
  if (id === "spec" && S.coverage) note += " · " + L.g2(S.coverage.found || 0, S.coverage.fixed || 0);
  return `<div class="stage"><span class="dot ${esc(st.status)}"></span>` +
    `<span class="nm">${esc(L.stageName[id] || id)}</span>` +
    `<span class="rest">${note}${time ? " · " + time : ""}</span></div>`;
}
function taskRow(t){
  const cls = String(t.status || "pending").replace("in-progress", "inprogress");
  const running = t.status === "in-progress" || t.status === "review" || t.status === "repair";
  const phase = L.phase[t.status] ? `<span class="phase">${L.phase[t.status]}</span>` : "";
  const time = t.startedAt ? live(t.startedAt, t.finishedAt) : "";
  return `<div class="task"><span class="num">${esc(t.id)}</span>` +
    `<span class="track ${t.status === "pending" ? "pending" : ""}">` +
      `<span class="fill ${cls}"></span>` +
      `<span class="lbl">${phase}${esc(t.title || "")}</span></span>` +
    `<span class="t">${(running || t.finishedAt) ? time : ""}</span></div>`;
}
function flowBlock(S){
  const T = S.tickets || [];
  if (!T.length){
    const sp = S.singlePass;
    if (!sp) return `<div class="empty">${L.noTasks}</div>`;
    return `<div class="card"><div class="k">${L.onePass}</div>` +
      `<div class="sub">${live(sp.startedAt, sp.finishedAt)}` +
      (sp.files ? ` · ${sp.files.length}` : "") +
      (sp.commit ? ` · <code>${esc(sp.commit)}</code>` : "") + "</div></div>";
  }
  /* сводка по состояниям: полосы показывают то же самое, но не отвечают «сколько сейчас» одним взглядом */
  const order = ["in-progress", "review", "repair", "done", "pending", "failed"];
  const chips = order
    .map(st => [st, T.filter(t => t.status === st).length])
    .filter(([, n]) => n > 0)
    .map(([st, n]) => L.chip[st] ? L.chip[st](n) : `${st} ${n}`)
    .join(" · ");

  const running = T.filter(t => t.status === "in-progress" || t.status === "review" || t.status === "repair");
  const now = running.length
    ? `${L.nowLbl} ` + running.map(t => `${esc(t.id)} — ${esc(t.title || "")}`).join(" · ")
    : L.nowIdle;

  const waves = {};
  T.forEach(t => {
    const w = t.wave || 1;
    (waves[w] = waves[w] || []).push(t);
  });
  return `<div class="card" style="margin-bottom:10px"><div class="k">${chips}</div>` +
    `<div class="sub">${now}</div></div>` +
    Object.keys(waves).sort((a, b) => a - b).map(w =>
      `<div class="wave">${L.wave(w, waves[w].length)}</div>` +
      waves[w].map(taskRow).join("")).join("");
}
function taskTable(S){
  const T = S.tickets || [];
  if (!T.length) return "";
  const rows = T.map(t => {
    const tests = t.tests ? `${t.tests.passed || 0}${t.tests.failed ? " / " + t.tests.failed : ""}` : L.none;
    const again = (t.retries || 0) + (t.repairs || 0) + (t.handoffs || 0);
    return "<tr>" +
      `<td>${esc(t.id)}</td>` +
      `<td class="wrapcell">${esc(t.title || "")}</td>` +
      `<td>${esc((t.requirements || []).join(", ")) || L.none}</td>` +
      `<td>${L.tstatus[t.status] || esc(t.status)}</td>` +
      `<td>${t.startedAt ? live(t.startedAt, t.finishedAt) : L.none}</td>` +
      `<td>${again || L.none}</td>` +
      `<td>${tests}</td>` +
      `<td>${t.commit ? `<code>${esc(t.commit)}</code>` : L.none}</td>` +
      "</tr>";
  }).join("");
  return `<h2>${L.table}</h2><div class="scroll"><table><thead><tr>` +
    `<th>${L.thN}</th><th>${L.thTitle}</th><th>${L.thReq}</th><th>${L.thState}</th>` +
    `<th>${L.thTime}</th><th>${L.thRetry}</th><th>${L.thTests}</th><th>${L.thCommit}</th>` +
    `</tr></thead><tbody>${rows}</tbody></table></div>`;
}
function controls(){
  const th = currentTheme();
  return `<div class="segs">` +
    `<div class="seg"><button type="button" data-auto aria-pressed="${auto}" ` +
      `title="${auto ? L.autoOn : L.autoOff}">&#8635;</button></div>` +
    `<div class="seg">` +
      `<button type="button" data-theme="light" aria-pressed="${th === "light"}" title="${L.themeLight}">&#9788;</button>` +
      `<button type="button" data-theme="dark" aria-pressed="${th === "dark"}" title="${L.themeDark}">&#9789;</button>` +
    `</div>` +
    `<div class="seg">` +
      `<button type="button" data-lang="ru" aria-pressed="${lang === "ru"}">RU</button>` +
      `<button type="button" data-lang="en" aria-pressed="${lang === "en"}">EN</button>` +
    `</div></div>`;
}

/* ---------- сборка страницы ---------- */
function render(){
  const app = document.getElementById("app");
  const S = window.STATE;
  const head = `<div class="top"><div class="mark">prd<span>.</span></div>${controls()}</div>`;

  if (!S || typeof S !== "object"){
    app.innerHTML = head + `<div class="miss"><h1>${L.noState}</h1><p>${L.noStateWhy}</p></div>`;
    bind();
    return;
  }

  const T = S.tickets || [], R = S.requirements || {}, m = stageMap(S);
  const now = S.finishedAt ? at(S.finishedAt) : Date.now();
  const doneTasks = T.filter(t => t.status === "done").length;
  const doneStages = STAGE_ORDER.filter(id => m[id] &&
    (m[id].status === "done" || m[id].status === "skipped")).length;

  /* покрытие считается против всех требований, кроме снятых пользователем */
  const counted = Math.max(0, (R.total || 0) - (R.dropped || 0));
  const done = overall(S);

  /* оценка остатка: медиана задачи на длину критического пути, диапазоном */
  const med = medianTask(S), path = criticalPath(S);
  let leftText = L.early, leftSub = L.needTwo;
  if (S.finishedAt){ leftText = L.finished; leftSub = ""; }
  else if (med && path){
    leftText = `${dur(med * path * 0.75)} … ${dur(med * path * 1.35)}`;
    leftSub = L.critpath(path);
  }

  const active = STAGE_ORDER.filter(id => m[id] && m[id].status === "active");
  const cur = active.length ? active[active.length - 1] : null;

  const badges = [
    S.mode ? `<span class="badge on">${L.mode}: ${L.modes[S.mode] || esc(S.mode)}</span>` : "",
    S.depth ? `<span class="badge">${L.depth}: ${L.depths[S.depth] || esc(S.depth)}</span>` : "",
    S.tier ? `<span class="badge">${L.tier(esc(S.tier))}</span>` : "",
    S.polish ? `<span class="badge">${L.polishBadge}</span>` : ""
  ].join("");

  const debt = S.debt || {};
  const dp = (debt.placeholders || []).length,
        da = (debt.assumptions || []).length,
        de = (debt.emptyEnv || []).length;

  const tests = S.tests
    ? `${S.tests.passed || 0}${S.tests.failed ? " · " + L.failed(S.tests.failed) : ""}`
    : L.none;

  const blind = S.blind ? `<h2>${L.blind}</h2><div class="card">` +
    `<div class="v">${L.blindV(esc(S.blind.matched), esc(S.blind.checked))}</div>` +
    ((S.blind.mismatches || []).length
      ? `<div class="sub">${L.blindBad}</div>${list(S.blind.mismatches)}`
      : `<div class="sub">${L.blindOk}</div>`) + "</div>" : "";

  const rounds = (S.polish && S.polish.rounds) || [];
  const polish = S.polish ? `<h2>${L.polish}</h2><div class="card">` +
    `<div class="v">${rounds.length}</div><div class="sub">${
      L.polishSub(rounds.length, rounds.reduce((n, r) => n + (r.accepted || 0), 0))}</div></div>` : "";

  app.innerHTML = head +
    `<h1>${esc(S.title || S.slug || "")}${S.prd ? " · " + esc(S.prd) : ""}</h1>` +
    `<div class="badges">${badges}</div>` +

    `<div class="headline"><div class="k">${L.progress}</div>` +
      `<div class="n">${done}%</div>` +
      `<div class="bar"><i style="width:${done}%"></i></div>` +
      `<div class="sub">${L.progressSub(doneStages, STAGE_ORDER.length)}${
        T.length ? " · " + L.tasksSub(pct(doneTasks, T.length)) : ""}</div></div>` +

    `<div class="grid">` +
      card(L.coverage, pct(R.done || 0, counted) + "%",
        L.reqOf(R.done || 0, counted) + "<br>" +
        L.coverageSub(R.dropped || 0, R.deferred || 0, R.placeholder || 0)) +
      card(L.stageNow, cur ? esc(L.stageName[cur] || cur) : (S.finishedAt ? L.finished : L.none),
        cur && m[cur].startedAt ? live(m[cur].startedAt, null) : "") +
      card(L.elapsed, live(S.startedAt, S.finishedAt), "") +
      card(L.left, leftText, leftSub) +
      card(L.tasks,
        T.length ? `${doneTasks} / ${T.length}` : (S.tier === "T0" ? L.noSplit : L.notCut),
        T.length ? L.tasksSub(pct(doneTasks, T.length)) : "") +
      card(L.debt, String(dp + da + de), L.debtSub(dp, da, de)) +
      card(L.tests, tests, L.testsSub) +
    "</div>" +

    `<h2>${L.stages}</h2><div class="card">${STAGE_ORDER.map(id => stageRow(S, id)).join("")}</div>` +
    `<h2>${L.flow}</h2>${flowBlock(S)}` +
    taskTable(S) + blind + polish +

    `<h2>${L.toClose}</h2><div class="grid">` +
      `<div class="card"><div class="k">${L.placeholders}</div>${list(debt.placeholders)}</div>` +
      `<div class="card"><div class="k">${L.assumptions}</div>${list(debt.assumptions)}</div>` +
      `<div class="card"><div class="k">${L.envVars}</div>${list(debt.emptyEnv)}</div>` +
      `<div class="card"><div class="k">${L.additions}</div>${list(S.additions)}</div>` +
      `<div class="card"><div class="k">${L.concerns}</div>${list(S.concerns)}</div>` +
    "</div>" +

    `<div class="foot">` +
      `<span data-updated="${esc(S.updatedAt || "")}" data-busy="${
        T.some(t => t.status === "in-progress")}">${L.updated} ${
        S.updatedAt ? ago(now - at(S.updatedAt)) : L.none}</span>` +
      (S.docsPath ? `<span>${L.filesIn} <code>${esc(S.docsPath)}</code></span>` : "") +
      (S.codeBranch ? `<span>${L.branch} <code>${esc(S.codeBranch)}</code></span>` : "") +
    "</div>";

  document.documentElement.lang = L.code;
  bind();
}

/* ---------- события ---------- */
function bind(){
  document.querySelectorAll("[data-lang]").forEach(b => {
    b.onclick = () => { lang = b.dataset.lang; L = DICT[lang]; store("prd-lang", lang); render(); };
  });
  /* только кнопки: applyTheme вешает data-theme на <html>, и голый [data-theme]
     ловил бы им же корень документа - тогда любой клик всплывал бы в этот обработчик */
  document.querySelectorAll("button[data-theme]").forEach(b => {
    b.onclick = () => {
      theme = (theme === b.dataset.theme) ? "system" : b.dataset.theme;
      store("prd-theme", theme);
      applyTheme();
      render();
    };
  });
  const a = document.querySelector("[data-auto]");
  if (a) a.onclick = () => { auto = !auto; store("prd-auto", auto ? "on" : "off"); render(); };
}

/* ---------- живые часы ---------- */
setInterval(() => {
  const S = window.STATE;
  const end = (S && S.finishedAt) ? at(S.finishedAt) : Date.now();
  document.querySelectorAll("[data-from]").forEach(el => {
    const f = el.dataset.from;
    if (!f) return;
    el.textContent = dur((el.dataset.to ? at(el.dataset.to) : end) - at(f));
  });
  const u = document.querySelector("[data-updated]");
  if (u && u.dataset.updated){
    const gap = end - at(u.dataset.updated);
    u.textContent = `${L.updated} ${ago(gap)}`;
    /* пишущаяся задача молчит десятками минут, поэтому её порог тишины другой */
    const limit = u.dataset.busy === "true" ? 45 * 60e3 : 5 * 60e3;
    u.classList.toggle("stale", !(S && S.finishedAt) && gap > limit);
  }
}, 1000);

/* ---------- перечитывание state.js ----------
   панели предпросмотра глушат навигацию, но не подгрузку под-ресурсов,
   поэтому состояние забирается новым <script>, а не перезагрузкой страницы */
function stamp(){
  const S = window.STATE;
  if (!S) return "";
  return [S.updatedAt, S.finishedAt, (S.tickets || []).length,
    (S.stages || []).map(s => s.status).join(""),
    (S.tickets || []).map(t => t.status).join("")].join("|");
}
let last = "";
setInterval(() => {
  if (!auto || (window.STATE && window.STATE.finishedAt)) return;
  const s = document.createElement("script");
  s.src = "state.js?t=" + Date.now();
  s.onload = s.onerror = () => {
    s.remove();
    const fresh = stamp();
    if (fresh !== last){ last = fresh; render(); }
  };
  document.body.appendChild(s);
}, 10000);

applyTheme();
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => {
  if (theme === "system") render();
});
last = stamp();
render();
</script>
