<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>prd</title>
<!-- Вёрстка и часть логики — по dashboard-template.html из nick-vels/skills (MIT, (c) 2026 Nick Vels). -->
<style>
  /* Цвет — сигнал состояния: синий — идёт работа, оранжевый — ждём человека или задача пишется,
     зелёный — сдано, бирюзовый — ревью, фиолетовый — ремонт, красный — упало. */
  :root{
    --bg:#F2F2F4; --card:#fff; --inset:#F4F4F6; --soft:#EBEBEE; --line:rgba(0,0,0,.07); --line2:rgba(0,0,0,.11);
    --tx:#111113; --tx2:#3A3A3C; --mut:#6B6B70; --quiet:#8E8E93;
    --hero:#2F45E0; --hero-shadow:rgba(40,60,220,.55);
    --done:#17864A; --done-soft:#E2F3E9; --done-tx:#126B3B;
    --now:#FF6B35; --now-on:#1A0D06; --now-soft:#FFE9DF; --now-tx:#AD3D0E;
    --rev:#0B7F8A; --rev-tx:#08666F;
    --fix:#7C3AED; --fix-tx:#6427D0;
    --bad:#DC2626; --bad-tx:#B01C1C;
    --idle:#D4D4D9;
    --sh:0 1px 2px rgba(0,0,0,.04),0 12px 30px -20px rgba(20,24,40,.2);
    --sh-raised:0 1px 2px rgba(0,0,0,.035),0 16px 36px -24px rgba(20,24,40,.24);
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      --bg:#17181B; --card:#222327; --inset:#2C2D32; --soft:#323338; --line:rgba(255,255,255,.08); --line2:rgba(255,255,255,.14);
      --tx:#F2F2F3; --tx2:#C7C7CC; --mut:#A3A3AA; --quiet:#85858C;
      --hero:#2639C2; --hero-shadow:rgba(0,0,0,.7);
      --done:#1E9A56; --done-soft:#1C3527; --done-tx:#5BD68C;
      --now-soft:#43271C; --now-tx:#FF8A5C;
      --rev:#0E8A96; --rev-tx:#6FD6E0;
      --fix:#8B4DF5; --fix-tx:#BFA2FF;
      --bad:#E5383B; --bad-tx:#FF8B8B;
      --idle:#4A4B51;
      --sh:0 1px 0 rgba(255,255,255,.03) inset,0 12px 30px -20px rgba(0,0,0,.75);
      --sh-raised:0 16px 36px -24px rgba(0,0,0,.8);
      color-scheme:dark;
    }
  }
  :root[data-theme="dark"]{
    --bg:#17181B; --card:#222327; --inset:#2C2D32; --soft:#323338; --line:rgba(255,255,255,.08); --line2:rgba(255,255,255,.14);
    --tx:#F2F2F3; --tx2:#C7C7CC; --mut:#A3A3AA; --quiet:#85858C;
    --hero:#2639C2; --hero-shadow:rgba(0,0,0,.7);
    --done:#1E9A56; --done-soft:#1C3527; --done-tx:#5BD68C;
    --now-soft:#43271C; --now-tx:#FF8A5C;
    --rev:#0E8A96; --rev-tx:#6FD6E0;
    --fix:#8B4DF5; --fix-tx:#BFA2FF;
    --bad:#E5383B; --bad-tx:#FF8B8B;
    --idle:#4A4B51;
    --sh:0 1px 0 rgba(255,255,255,.03) inset,0 12px 30px -20px rgba(0,0,0,.75);
    --sh-raised:0 16px 36px -24px rgba(0,0,0,.8);
    color-scheme:dark;
  }
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;background:var(--bg);color:var(--tx);
    font:15px/1.5 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased}
  :focus-visible{outline:2px solid var(--now);outline-offset:3px}
  code,.mono{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace}
  .big b,.tv,.s-time,.tl-time,.ev em{font-variant-numeric:tabular-nums}
  a{color:inherit}
  .wrap{max-width:1320px;margin:0 auto;padding:22px 32px 40px;display:flex;flex-direction:column;gap:20px;min-width:0}
  .card{background:var(--card);border:1px solid var(--line);border-radius:26px;box-shadow:var(--sh);padding:24px 26px;min-width:0}
  .ic{width:16px;height:16px;flex:0 0 auto;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
  .ic.xs{width:14px;height:14px;stroke-width:2.6}
  .ic.m{width:20px;height:20px}
  .wt{font-size:17px;font-weight:650;letter-spacing:-.01em;margin:0;line-height:1.3;display:flex;align-items:center;gap:10px}
  .whead{display:flex;align-items:baseline;justify-content:space-between;gap:8px 12px;margin-bottom:16px;flex-wrap:wrap}
  .whead>span{font-size:14px;color:var(--mut)}

  /* верх */
  .top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
  .mark{font-size:26px;font-weight:800;letter-spacing:-.04em;line-height:1}
  .tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .tabs{display:inline-flex;gap:2px;padding:3px;border-radius:999px;background:var(--card);border:1px solid var(--line);box-shadow:var(--sh-raised)}
  .tabs button,.iconbtn{appearance:none;border:0;font:inherit;cursor:pointer;display:inline-flex;align-items:center;justify-content:center}
  .tabs button{height:36px;min-width:40px;padding:0 12px;border-radius:999px;background:transparent;color:var(--mut);font-size:13.5px;font-weight:650}
  .tabs button:hover{color:var(--tx)}
  .tabs button[aria-pressed="true"]{background:var(--tx);color:var(--card)}
  .iconbtn{width:44px;height:44px;border-radius:999px;border:1px solid var(--line);background:var(--card);box-shadow:var(--sh-raised);color:var(--tx)}
  .iconbtn:active{transform:scale(.96)}
  .iconbtn.busy svg{animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .title h1{margin:0;font-size:32px;line-height:1.12;font-weight:700;letter-spacing:-.03em;text-wrap:balance;overflow-wrap:anywhere}
  .meta{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:12px}
  .tag{display:inline-flex;align-items:center;height:28px;padding:0 11px;border-radius:999px;background:var(--card);border:1px solid var(--line2);font-size:13px;font-weight:600;color:var(--tx2)}
  .meta .when{font-size:14px;color:var(--mut);margin-left:4px}
  .lost{max-width:1320px;margin:0 auto;padding:16px 32px 0}
  #link{background:var(--now);color:var(--now-on);border-radius:18px;padding:14px 18px;font-weight:600;font-size:14.5px;line-height:1.45}

  /* шапка состояния */
  .hero{--h-tx:#fff;--h-mut:rgba(255,255,255,.82);--h-track:rgba(255,255,255,.24);
    border-radius:28px;padding:28px 30px 26px;display:flex;flex-direction:column;gap:28px;
    background:var(--hero);color:var(--h-tx);box-shadow:0 30px 60px -32px var(--hero-shadow);min-width:0}
  .hero.ask{background:#FF6B35;--h-tx:#1A0D06;--h-mut:rgba(26,13,6,.74);--h-track:rgba(26,13,6,.16);box-shadow:0 30px 60px -30px rgba(200,70,20,.6)}
  .hero.won{background:#17864A;--h-track:rgba(255,255,255,.22);box-shadow:0 30px 60px -30px rgba(23,134,74,.6)}
  .hero.bad{background:#C81E1E;--h-track:rgba(255,255,255,.22);box-shadow:0 30px 60px -30px rgba(200,30,30,.55)}
  .hero-top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:20px 40px}
  .hero-main{flex:1 1 420px;min-width:0}
  .state{display:inline-flex;align-items:center;gap:9px;font-size:14px;font-weight:700;margin-bottom:12px}
  .hero h2{margin:0;font-size:34px;line-height:1.1;font-weight:700;letter-spacing:-.03em;text-wrap:balance;max-width:32ch;overflow-wrap:anywhere}
  .lead{margin:12px 0 0;font-size:16.5px;line-height:1.5;color:var(--h-mut);max-width:64ch;overflow-wrap:anywhere}
  .lead b{color:var(--h-tx);font-weight:650}
  .big{text-align:right;flex:0 0 auto}
  .big b{display:block;font-size:58px;line-height:.95;font-weight:700;letter-spacing:-.045em}
  .big b small{font-size:24px;letter-spacing:-.02em;font-weight:600;margin-left:6px}
  .big>span{display:block;font-size:14px;color:var(--h-mut);margin-top:10px}
  .big .paused{display:block;margin-top:6px;font-weight:650;color:var(--h-tx)}
  .hint{display:inline-flex;align-items:center;gap:10px;margin-top:18px;min-height:44px;padding:8px 18px;border-radius:22px;background:#1A0D06;color:#fff;font-size:15px;font-weight:600;line-height:1.35}
  .track{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:5px}
  .seg{height:12px;border-radius:4px;background:var(--h-track);overflow:hidden}
  .seg i{display:block;height:100%;border-radius:4px}
  .s-done .seg i{width:100%;background:#21A35B}
  .hero.won .s-done .seg i,.hero.bad .s-done .seg i{background:#fff}
  .hero.ask .s-done .seg i{background:#1A0D06}
  .s-now .seg i{background-color:var(--now)}
  .hero.ask .s-now .seg i{background-color:#fff}
  .s-fail .seg i{width:100%;background:#fff}
  .s-skip .seg{background:repeating-linear-gradient(135deg,var(--h-track) 0 4px,transparent 4px 8px)}
  .s-name{display:block;margin-top:10px;font-size:13px;font-weight:600;line-height:1.3}
  .s-now .s-name,.s-fail .s-name{font-weight:750}
  .s-pend .s-name,.s-skip .s-name{color:var(--h-mut);font-weight:500}
  .s-time{display:block;margin-top:2px;font-size:12.5px;color:var(--h-mut)}
  .live{width:9px;height:9px;border-radius:50%;background:var(--now);outline:2px solid rgba(255,255,255,.9);display:inline-block;flex:0 0 auto;animation:pulse 1.8s cubic-bezier(.16,1,.3,1) infinite}
  .hero.ask .live{background:#1A0D06;outline:0}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,107,53,.6)}70%{box-shadow:0 0 0 9px rgba(255,107,53,0)}100%{box-shadow:0 0 0 0 rgba(255,107,53,0)}}
  .badge-ic{width:26px;height:26px;border-radius:50%;background:#fff;display:inline-flex;align-items:center;justify-content:center}
  .hero.won .badge-ic{color:#17864A}.hero.bad .badge-ic{color:#C81E1E}
  .stripes{background-image:linear-gradient(135deg,rgba(255,255,255,.28) 25%,transparent 25%,transparent 50%,rgba(255,255,255,.28) 50%,rgba(255,255,255,.28) 75%,transparent 75%,transparent);background-size:22px 22px;animation:stripes 1.1s linear infinite}
  .hero.ask .stripes{background-image:linear-gradient(135deg,rgba(255,107,53,.5) 25%,transparent 25%,transparent 50%,rgba(255,107,53,.5) 50%,rgba(255,107,53,.5) 75%,transparent 75%,transparent)}
  @keyframes stripes{to{background-position:22px 0}}

  /* плитки */
  .tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:20px}
  .tile{display:flex;flex-direction:column;gap:11px;padding:20px 22px}
  .tk{font-size:13.5px;font-weight:600;color:var(--mut)}
  .tv{font-size:38px;line-height:1;font-weight:700;letter-spacing:-.04em}
  .tv small{font-size:17px;font-weight:600;color:var(--mut);letter-spacing:-.01em;margin-left:4px}
  .tv.dim{color:var(--quiet)}
  .ts{font-size:13px;color:var(--mut);line-height:1.4}
  .stack{display:flex;height:10px;border-radius:5px;overflow:hidden;gap:2px;background:var(--inset)}
  .stack i{display:block;height:100%}
  .sq{display:flex;gap:5px;flex-wrap:wrap}
  .sq i{width:18px;height:18px;border-radius:5px;display:block}
  .okb{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:999px;font-size:12.5px;font-weight:700;align-self:flex-start;color:#fff}

  /* цвета статусов */
  .f-done{background:var(--done);color:#fff}
  .f-now{background-color:var(--now);color:var(--now-on)}
  .f-rev{background:var(--rev);color:#fff}
  .f-fix{background:var(--fix);color:#fff}
  .f-bad{background:var(--bad);color:#fff}
  .f-wait{background:transparent;color:var(--mut);border:1.5px dashed var(--idle)}
  .f-idle{background:var(--idle)}
  .f-q{background:var(--quiet)}

  /* ход работы */
  .legend{display:flex;flex-wrap:wrap;gap:6px}
  .lg{display:inline-flex;align-items:center;gap:7px;height:30px;padding:0 11px 0 9px;border-radius:999px;background:var(--inset);font-size:13px;font-weight:600;color:var(--tx2)}
  .lg i{width:11px;height:11px;border-radius:3px;display:block}
  .lg b{font-weight:750;color:var(--tx)}
  .wave{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 8px;font-size:12px;font-weight:750;letter-spacing:.05em;text-transform:uppercase;color:var(--quiet);margin:18px 0 8px}
  .whead+.wave{margin-top:4px}
  .wave span{text-transform:none;letter-spacing:0;font-weight:500;font-size:13px}
  .tl{display:grid;grid-template-columns:32px minmax(0,1fr) 64px;gap:4px 12px;align-items:center;margin-bottom:7px}
  .tl-id{font-size:14.5px;font-weight:750;color:var(--quiet)}
  .tl-id.on{color:var(--tx)}
  .bar{height:42px;border-radius:12px;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:0 6px 0 15px;font-size:14.5px;font-weight:650;min-width:0}
  .bar .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
  .chipin{flex:0 0 auto;display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 10px;border-radius:999px;background:rgba(255,255,255,.2);font-size:12.5px;font-weight:700;white-space:nowrap}
  .f-now .chipin{background:rgba(26,13,6,.12)}
  .f-wait .chipin{background:var(--inset);color:var(--mut)}
  .tl-time{font-size:13.5px;font-weight:650;text-align:right;color:var(--mut);white-space:nowrap}
  .tl-time.now{color:var(--now-tx)}.tl-time.fix{color:var(--fix-tx)}.tl-time.rev{color:var(--rev-tx)}.tl-time.bad{color:var(--bad-tx)}
  .tl-note{grid-column:2/4;display:flex;gap:8px;align-items:flex-start;font-size:13.5px;line-height:1.45;padding:1px 2px 6px;overflow-wrap:anywhere}
  .tl-note.fix{color:var(--fix-tx)}.tl-note.bad{color:var(--bad-tx)}
  .tl-note .ic{margin-top:2px}

  /* колонки и списки */
  .cols{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:20px;align-items:start}
  .col{display:flex;flex-direction:column;gap:20px;min-width:0}
  .req{display:grid;grid-template-columns:minmax(0,1fr);gap:14px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
  .req p{margin:0;font-size:15px;line-height:1.45;overflow-wrap:anywhere}
  .rid{display:inline-block;min-width:40px;font-size:12px;color:var(--quiet);font-weight:750}
  .btn-soft{appearance:none;height:38px;padding:0 15px;border-radius:999px;border:0;background:var(--soft);color:var(--tx);font:inherit;font-size:13.5px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
  .gate{display:grid;grid-template-columns:32px minmax(0,1fr) auto;gap:12px;align-items:start;padding:12px 0;border-top:1px solid var(--line)}
  .whead+.gate{border-top:0;padding-top:0}
  .gi{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center}
  .gi.ok{background:var(--done);color:#fff}
  .gi.wait{color:var(--quiet);border:1.5px dashed var(--idle)}
  .gi.warn{background:var(--now);color:var(--now-on)}
  .gi.bad{background:var(--bad);color:#fff}
  .gt{font-size:15px;font-weight:650;line-height:1.35}
  .gs{font-size:13px;color:var(--mut);margin-top:2px;line-height:1.45;overflow-wrap:anywhere}
  .gk{font-size:12px;font-weight:750;color:var(--quiet);padding-top:3px}
  .use{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;align-items:baseline;padding:12px 0;border-top:1px solid var(--line)}
  .whead+.use{border-top:0;padding-top:0}
  .use b{font-size:20px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums;white-space:nowrap}
  .use b small{font-size:14px;font-weight:600;color:var(--mut);letter-spacing:0}
  .use .gs{grid-column:1/-1;margin:0}
  .use+.muted{margin-top:6px;font-size:13px}
  .ev{display:grid;grid-template-columns:26px minmax(0,1fr) auto;gap:11px;align-items:start;padding:9px 0;font-size:14px;line-height:1.45;border-top:1px solid var(--line)}
  .whead+.ev{border-top:0;padding-top:0}
  .ei{width:26px;height:26px;border-radius:8px;display:flex;align-items:center;justify-content:center;background:var(--inset);color:var(--mut)}
  .ev>span{padding-top:2px;overflow-wrap:anywhere}
  .ev em{font-style:normal;font-size:12.5px;color:var(--quiet);white-space:nowrap;padding-top:3px}
  .need{padding:13px 0;border-top:1px solid var(--line)}
  .whead+.need{border-top:0;padding-top:0}
  .nh{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:15px;font-weight:650}
  .nh span{font-size:14px;font-weight:600;color:var(--mut)}
  .keys{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
  .key{font-size:12.5px;padding:5px 9px;border-radius:9px;background:var(--inset);color:var(--tx2);overflow-wrap:anywhere}
  .nl{margin:8px 0 0;padding:0;list-style:none;font-size:14px;color:var(--tx2);line-height:1.45}
  .nl li{overflow-wrap:anywhere}
  .nl li+li{margin-top:7px}
  .nl.n0{margin-top:0}
  .nl+.btn-soft{margin-top:12px}
  .prep{border:2px solid var(--now)}
  .prep .wt i{width:28px;height:28px;border-radius:8px;background:var(--now);color:var(--now-on);display:inline-flex;align-items:center;justify-content:center}
  .blind-top{display:flex;align-items:center;gap:18px;margin-bottom:6px;flex-wrap:wrap}
  .blind-top b{font-size:38px;font-weight:700;letter-spacing:-.04em;line-height:1}
  .blind-top b small{font-size:17px;color:var(--mut);font-weight:600;margin-left:4px}
  .blind-top p{margin:0;flex:1 1 260px;font-size:14px;line-height:1.5;color:var(--mut)}
  .empty{display:flex;gap:12px;align-items:flex-start;padding:16px 18px;border-radius:16px;border:1.5px dashed var(--idle);font-size:14.5px;line-height:1.5;color:var(--tx2)}
  .empty .ic{color:var(--mut);margin-top:3px}
  .muted{color:var(--mut);font-size:14px;line-height:1.5;margin:0}
  footer{display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px 20px;font-size:13px;color:var(--mut);padding:2px 4px 0}
  footer code{font-size:12.5px;color:var(--tx2);overflow-wrap:anywhere}
  .stale{color:var(--now-tx);font-weight:650}

  /* Появление — только на первой отрисовке: страница перерисовывается на каждом событии. */
  .boot .w{animation:rise .8s cubic-bezier(.16,1,.3,1) both}
  @keyframes rise{from{transform:translateY(10px);opacity:.01}to{transform:none;opacity:1}}
  @media (prefers-reduced-motion:reduce){.boot .w,.live,.stripes,.iconbtn.busy svg{animation:none}}

  @media (max-width:1180px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
  @media (max-width:1040px){.cols{grid-template-columns:minmax(0,1fr)}}
  /* Узкая панель рядом с чатом — главный способ смотреть дашборд. */
  @media (max-width:900px){
    body{font-size:14px}
    .wrap{padding:14px 14px 28px;gap:12px}
    .lost{padding:12px 14px 0}
    .mark{font-size:20px}
    .tabs button{height:30px;min-width:34px;padding:0 9px;font-size:12.5px}
    .iconbtn{width:36px;height:36px}
    .title h1{font-size:21px;letter-spacing:-.02em}
    .meta{margin-top:8px;gap:6px}
    .tag{height:24px;padding:0 9px;font-size:12px}
    .meta .when{font-size:12.5px}
    .card{padding:16px;border-radius:18px}
    .wt{font-size:15px}
    .whead{margin-bottom:12px}
    .whead>span{font-size:12.5px}
    .hero{padding:18px 18px 16px;border-radius:20px;gap:18px}
    .hero-top{gap:14px;align-items:flex-start}
    .hero-main{flex-basis:100%}
    .state{font-size:12.5px;margin-bottom:8px}
    .hero h2{font-size:21px;letter-spacing:-.02em;max-width:none}
    .lead{font-size:14px;margin-top:8px}
    .big{text-align:left}
    .big b{font-size:30px;letter-spacing:-.03em}
    .big b small{font-size:15px}
    .big>span{font-size:12.5px;margin-top:4px}
    .hint{font-size:13.5px;margin-top:12px;padding:8px 14px;min-height:38px}
    .track{grid-template-columns:repeat(4,minmax(0,1fr));gap:12px 4px}

/* ---------- настройки страницы ---------- */
function store(k, v){
  try {
    if (v === null) localStorage.removeItem(k);
    else if (v !== undefined) localStorage.setItem(k, v);
    return localStorage.getItem(k);
  } catch (e) { return null; }
}
/* Прошлая версия хранила здесь выключатель, который замораживал опрос навсегда. */
store("prd-auto", null);
let CUR = I18N[store("prd-lang") === "en" ? "en" : "ru"];
const storedTheme = () => { const t = store("prd-theme"); return t === "light" || t === "dark" ? t : null; };
const systemDark = () => { try { return matchMedia("(prefers-color-scheme: dark)").matches; } catch (e) { return false; } };
const effectiveTheme = () => storedTheme() || (systemDark() ? "dark" : "light");
function applyTheme(){
  const t = storedTheme();
  if (t) document.documentElement.setAttribute("data-theme", t);
  else document.documentElement.removeAttribute("data-theme");
}
const UI = {open: {}};

/* ---------- время ---------- */
const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const toMs = v => { const t = v ? new Date(v).getTime() : NaN; return isNaN(t) ? null : t; };
const spanMs = (from, to) => {
  const a = toMs(from);
  if (a == null) return null;
  return Math.max(0, (toMs(to) ?? Date.now()) - a);
};

/* Часы показывают работу, а не календарь: промежуток между соседними отметками режется
   по порогу простоя, а ожидание ответа пользователя (waits, waiting) вычитается целиком. */
let MARKS = [], WAITS = [];
/* updatedAt перезаписывается, поэтому страница помнит увиденные значения сама. */
function rememberBeats(S){
  const key = "prd-beats:" + (S.slug || "") + ":" + (S.startedAt || "");
  try {
    const seen = JSON.parse(localStorage.getItem(key) || "[]");
    if (S.updatedAt && seen.indexOf(S.updatedAt) === -1){
      seen.push(S.updatedAt);
      localStorage.setItem(key, JSON.stringify(seen.slice(-600)));
    }
    return seen;
  } catch (e) { return []; }
}
function collectMarks(S){
  const out = [];
  const push = v => { const t = toMs(v); if (t != null) out.push(t); };
  push(S.startedAt); push(S.updatedAt); push(S.finishedAt);
  rememberBeats(S).forEach(push);
  (S.stages || []).forEach(x => { push(x.startedAt); push(x.finishedAt); });
  (S.tickets || []).forEach(x => { push(x.startedAt); push(x.finishedAt); });
  (S.waits || []).forEach(x => { push(x.from); push(x.to); });
  if (S.waiting) push(S.waiting.since);
  return Array.from(new Set(out)).sort((a, b) => a - b);
}
function collectWaits(S){
  const out = [];
  (S.waits || []).forEach(w => {
    const a = toMs(w.from), b = toMs(w.to);
    if (a != null && b != null && b > a) out.push([a, b]);
  });
  if (S.waiting && !S.finishedAt){
    const a = toMs(S.waiting.since);
    if (a != null) out.push([a, null]);
  }
  return out;
}
function waitedIn(a, b){
  let s = 0;
  WAITS.forEach(([x, y]) => {
    const hi = Math.min(b, y == null ? Date.now() : y), lo = Math.max(a, x);
    if (hi > lo) s += hi - lo;
  });
  return s;
}
function activeMs(from, to){
  const a = toMs(from);
  if (a == null) return null;
  const b = toMs(to) ?? Date.now();
  if (b <= a) return 0;
  const pts = [a].concat(MARKS.filter(t => t > a && t < b), [b]);
  let s = 0;
  for (let i = 1; i < pts.length; i++){
    const gap = pts[i] - pts[i - 1] - waitedIn(pts[i - 1], pts[i]);
    s += Math.min(Math.max(0, gap), IDLE_CAP_MS);
  }
  return s;
}
function idleNow(){
  const S = window.STATE;
  if (!S || S.finishedAt || S.waiting) return false;
  const last = MARKS.length ? MARKS[MARKS.length - 1] : null;
  return last != null && Date.now() - last > IDLE_CAP_MS;
}
const fmtClock = ms => {
  if (ms == null) return "—";
  const s = Math.floor(ms / 1000), h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), ss = s % 60;
  const p = n => String(n).padStart(2, "0");
  return h ? `${h}:${p(m)}:${p(ss)}` : `${m}:${p(ss)}`;
};
const fmtDur = m => m == null ? "—"
  : m < 60 ? m + " " + CUR.min : Math.floor(m / 60) + " " + CUR.hr + " " + String(m % 60).padStart(2, "0") + " " + CUR.min;
const hhmm = iso => { const t = toMs(iso); if (t == null) return ""; const d = new Date(t);
  return String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0"); };
/* Открытый интервал получает data-live — его раз в секунду обновляет tick(). */
function timerHTML(from, to){
  const ms = activeMs(from, to);
  if (ms == null) return "—";
  return to ? fmtClock(ms) : `<span data-live data-from="${esc(from)}">${fmtClock(ms)}</span>`;
}
function agoText(iso){
  const ms = spanMs(iso, null);
  if (ms == null) return "—";
  const s = Math.floor(ms / 1000);
  if (s < 60) return CUR.ago.s(s);
  const m = Math.floor(s / 60);
  return m < 60 ? CUR.ago.m(m) : CUR.ago.h(Math.floor(m / 60), m % 60);
}
function agoShort(iso){
  const ms = spanMs(iso, null);
  if (ms == null) return "";
  const m = Math.floor(ms / 60000);
  return m < 1 ? CUR.agoShort.s : m < 60 ? CUR.agoShort.m(m) : CUR.agoShort.h(Math.floor(m / 60));
}
function tick(){
  const S = window.STATE || {};
  const stopped = idleNow();
  document.querySelectorAll("[data-live][data-from]").forEach(el => { el.textContent = fmtClock(activeMs(el.dataset.from, null)); });
  document.querySelectorAll("[data-since]").forEach(el => { el.textContent = fmtClock(spanMs(el.dataset.since, null)); });
  document.querySelectorAll("[data-idle-note]").forEach(el => { el.hidden = !stopped; });
  document.querySelectorAll("[data-ago]").forEach(el => {
    el.textContent = agoText(el.dataset.ago);
    /* молчание дольше порога простоя — тот же момент, когда встают часы */
    el.classList.toggle("stale", !S.finishedAt && !S.waiting && spanMs(el.dataset.ago, null) > IDLE_CAP_MS);
  });
  document.querySelectorAll("[data-ago-short]").forEach(el => { el.textContent = agoShort(el.dataset.agoShort); });
}

/* ---------- перечитывание state.js ----------
   Панели предпросмотра глушат навигацию, но не подгрузку под-ресурсов,
   поэтому состояние забирается новым <script>, а не перезагрузкой страницы. */
const SERVED = /^https?:$/.test(location.protocol);
let pollT = null, pulling = false, misses = 0, lastStamp = null, booted = false;
/* оркестратор часто правит статус, не двигая updatedAt, — поэтому в метке и статусы */
const stampOf = S => [S.updatedAt, S.finishedAt, S.waiting ? S.waiting.since : "", (S.tickets || []).length,
  (S.stages || []).map(s => s.status).join(""), (S.tickets || []).map(t => t.status).join(""),
  (window.USAGE || {}).updatedAt || ""].join("|");

function applyState(){
  const S = window.STATE;
  if (!S || typeof S !== "object") return;
  const stamp = stampOf(S);
  if (stamp === lastStamp) return;
  lastStamp = stamp;
  const y = window.scrollY;
  try { render(); } catch (e) { lastStamp = ""; bootFail(esc(String(e && e.message || e))); }
  window.scrollTo(0, y);
}
/* Две неудачи подряд — уже не файл, пойманный на записи, а мёртвый сервер. */
function showLink(){
  const el = document.getElementById("link");
  const lost = SERVED && misses >= 2 && !(window.STATE && window.STATE.finishedAt);
  el.parentNode.hidden = !lost;
  if (lost) el.textContent = CUR.lost;
}
function pullScript(name, done){
  const s = document.createElement("script");
  s.src = name + "?t=" + Date.now();
  s.onload = () => { s.remove(); done(true); };
  s.onerror = () => { s.remove(); done(false); };
  document.head.appendChild(s);
}
/* usage.js раньше state.js: после finishedAt опрос встаёт, и последний расход должен успеть в этот же круг */
function pullState(done){
  if (pulling) return;
  pulling = true;
  pullScript("usage.js", () => pullScript("state.js", ok => {
    pulling = false;
    misses = ok ? 0 : misses + 1;
    if (ok) applyState();
    showLink();
    if (done) done(ok);
  }));
}
function pollState(){
  clearTimeout(pollT);
  if (window.STATE && window.STATE.finishedAt) return;
  pollT = setTimeout(() => pullState(pollState), POLL_MS);
}
function refreshNow(btn){
  clearTimeout(pollT);
  if (btn) btn.classList.add("busy");
  const started = Date.now();
  pullState(ok => {
    if (!ok && btn) misses = Math.max(misses, 2);
    showLink();
    /* крутится хотя бы полсекунды, иначе мгновенный ответ не отличить от «не нажалось» */
    setTimeout(() => document.querySelectorAll("[data-refresh]").forEach(b => b.classList.remove("busy")),
      Math.max(0, 500 - (Date.now() - started)));
    pollState();
  });
}

/* ---------- отрисовка ---------- */
const KIND = {
  "done":        {k:"done", bar:"f-done", icon:"check"},
  "in-progress": {k:"now",  bar:"f-now stripes", icon:"pen", on:true},
  "review":      {k:"rev",  bar:"f-rev", icon:"clock", on:true},
  "repair":      {k:"fix",  bar:"f-fix", icon:"rotate", on:true},
  "failed":      {k:"bad",  bar:"f-bad", icon:"x", on:true},
  "pending":     {k:"wait", bar:"f-wait", icon:"hourglass"}
};
const kindOf = t => KIND[t.status] || KIND.pending;

function render(){
  const L = CUR, S = window.STATE, T = S.tickets || [], R = S.requirements || {};
  MARKS = collectMarks(S);
  WAITS = collectWaits(S);
  const fin = !!S.finishedAt;
  const waiting = !fin && S.waiting ? S.waiting : null;

  const by = st => T.filter(t => t.status === st);
  const done = by("done"), writing = by("in-progress"), inReview = by("review"),
        inRepair = by("repair"), failedT = by("failed");
  const running = writing.concat(inReview, inRepair);
  const live = Math.max(0, (R.total || 0) - (R.dropped || 0));
  const byId = Object.fromEntries(T.map(t => [t.id, t]));

  const mins = t => (t.startedAt && t.finishedAt)
    ? Math.max(1, Math.round(activeMs(t.startedAt, t.finishedAt) / 60000)) : null;
  const durations = done.map(mins).filter(Boolean).sort((a, b) => a - b);
  /* на одной сданной задаче медиана — случайность, оценку не строим */
  const median = durations.length >= 2 ? durations[Math.floor(durations.length / 2)] : null;

  const given = Array.isArray(S.stages) ? S.stages.filter(Boolean) : [];
  const stages = STAGE_IDS.map(id => given.find(s => s.id === id) || {id, status:"pending"});
  const stage = id => stages.find(s => s.id === id);
  const stName = s => L.stages[s.id] || s.id;
  const actives = stages.filter(s => s.status === "active");
  /* build и review активны вместе — ревью идёт по задачам внутри разработки */
  const activeStage = actives.find(s => s.id === "build") || actives[actives.length - 1];
  const failedStage = stages.find(s => s.status === "failed");
  const t0 = String(S.tier).toUpperCase() === "T0";
  const sp = S.singlePass;

  /* ---------- сколько осталось ----------
     По цепочке задач в минутах: идущая двадцатую минуту задача стоит в оценке не как новая.
     Ревью идёт внутри разработки, поэтому хвост после неё — только приёмка. */
  const leftFor = t => {
    if (!t || t.status === "done") return 0;
    if (t.status === "review") return median * 0.2;
    if (t.status === "repair") return median * 0.5;
    if (t.status === "in-progress" && t.startedAt)
      return Math.max(1, median - (activeMs(t.startedAt, null) || 0) / 60000);
    return median;
  };
  const memo = {};
  function chainMin(id, seen){
    const t = byId[id];
    if (!t || t.status === "done") return 0;
    if (memo[id] != null) return memo[id];
    if (seen.has(id)) return leftFor(t);
    seen.add(id);
    const d = leftFor(t) + Math.max(0, ...(t.blockedBy || []).map(b => chainMin(b, seen)));
    seen.delete(id);
    return memo[id] = d;
  }
  let left = null, lateEta = false;
  if (!fin && !waiting && !failedStage && activeStage){
    if ((activeStage.id === "build" || activeStage.id === "review") && median && T.length){
      left = Math.max(0, ...T.map(t => chainMin(t.id, new Set()))) + finalTailMin(T.length);
    } else if (activeStage.id === "final"){
      left = Math.max(5, finalTailMin(T.length) - (activeMs(activeStage.startedAt, null) || 0) / 60000);
      lateEta = true;
    }
  }
  const eta = left ? [Math.max(1, Math.round(left * 0.75)), Math.max(2, Math.round(left * 1.4))] : null;
  const etaText = eta ? (eta[1] < 60 ? `${eta[0]}–${eta[1]}<small>${L.min}</small>` : `${fmtDur(eta[0])} — ${fmtDur(eta[1])}`) : "";

  /* ---------- шапка ---------- */
  const names = list => list.map(t => q(esc(t.title), L.lang)).join(", ");
  const env = (S.debt && S.debt.emptyEnv) || [], ph = (S.debt && S.debt.placeholders) || [],
        asm = (S.debt && S.debt.assumptions) || [];
  let heroCls = "", stateLine, h2, lead = "", big = "", bigSub = "", hint = "";
  if (fin){
    heroCls = "won";
    stateLine = `<span class="badge-ic">${ic("check", "xs")}</span>${L.doneState}`;
    h2 = esc(S.result || L.doneDefault);
    lead = env.length || ph.length ? L.doneNeed(env.length, ph.length) : L.doneNothing;
    big = fmtClock(activeMs(S.startedAt, S.finishedAt));
    bigSub = L.doneBig(hhmm(S.finishedAt));
  } else if (waiting){
    heroCls = "ask";
    stateLine = `<span class="live" aria-hidden="true"></span>${L.waitState}`;
    h2 = L.waitH2[waiting.kind] || L.waitState;
    lead = waiting.note ? esc(waiting.note) : "";
    hint = `<span class="hint">${ic("msg", "m")}${L.waitHint}</span>`;
    big = `<span data-since="${esc(waiting.since)}">${fmtClock(spanMs(waiting.since, null))}</span>`;
    bigSub = L.waitBig;
  } else if (failedStage){
    heroCls = "bad";
    stateLine = `<span class="badge-ic">${ic("x", "xs")}</span>${L.failState}`;
    h2 = L.failH2(stName(failedStage));
    lead = esc(failedStage.note || "");
  } else {
    const cur = activeStage || stages.find(s => s.status === "pending") || stages[stages.length - 1];
    stateLine = `<span class="live" aria-hidden="true"></span>${L.stateRun[cur.id] || stName(cur)}`;
    if ((cur.id === "build" || cur.id === "review") && T.length){
      h2 = done.length === T.length ? L.buildAllDone(T.length) : L.buildH2(done.length, T.length, running.length);
      lead = [writing.length ? L.leadWriting(names(writing)) : "", inReview.length ? L.leadReview(names(inReview)) : "",
        inRepair.length ? L.leadRepair(names(inRepair)) : "", failedT.length ? L.leadFailed(names(failedT)) : ""]
        .filter(Boolean).join(" ") || (done.length < T.length ? L.leadIdle : "");
    } else if (cur.id === "build" && t0){
      h2 = L.singleH2;
      lead = cur.note ? esc(cur.note) : "";
    } else {
      h2 = L.h2Run[cur.id] || stName(cur);
      lead = cur.note ? esc(cur.note) : (L.leadRun[cur.id] || "");
    }
    if (eta){ big = etaText; bigSub = lateEta ? L.etaLate : L.etaLbl; }
    else if (cur.startedAt){ big = timerHTML(cur.startedAt, null); bigSub = L.stageClock(stName(cur)); }
  }
  const segs = stages.map(s => {
    let cls = "s-pend", fill = "0%", inner = "", time = L.ahead;
    if (s.status === "done"){ cls = "s-done"; fill = "100%"; time = s.startedAt ? timerHTML(s.startedAt, s.finishedAt) : "—"; }
    else if (s.status === "skipped"){ cls = "s-skip"; time = L.skipped; }
    else if (s.status === "failed"){ cls = "s-fail"; fill = "100%"; time = L.failedSt; }
    else if (s.status === "active"){
      cls = "s-now"; inner = "stripes";
      fill = (s.id === "build" || s.id === "review") && T.length
        ? Math.max(8, Math.round(done.length / T.length * 100)) + "%" : "50%";
      time = waiting ? L.waitingSt : (s.startedAt ? timerHTML(s.startedAt, null) : "—");
    }
    return `<div class="${cls}" role="listitem"><div class="seg"><i class="${inner}" style="width:${fill}"></i></div>` +
      `<span class="s-name">${esc(stName(s))}</span><span class="s-time">${time}</span></div>`;
  }).join("");
  const hero = `<section class="hero ${heroCls} w" aria-live="polite">
    <div class="hero-top">
      <div class="hero-main"><div class="state">${stateLine}</div><h2>${h2}</h2>
        ${lead ? `<p class="lead">${lead}</p>` : ""}${hint}</div>
      ${big ? `<div class="big"><b>${big}</b><span>${bigSub}</span>
        <span class="paused" data-idle-note hidden>${L.paused}</span></div>` : ""}
    </div>
    <div class="track" role="list">${segs}</div>
  </section>`;

  /* ---------- плитки ---------- */
  const rk = {done:R.done || 0, work:(R.inTicket || 0) + (R.inSpec || 0), ph:R.placeholder || 0, def:R.deferred || 0, drop:R.dropped || 0};
  rk.open = Math.max(0, (R.total || 0) - rk.done - rk.work - rk.ph - rk.def - rk.drop);
  const reqStack = `<div class="stack" aria-hidden="true">${[[rk.done, "f-done"], [rk.ph, "f-now"], [rk.work + rk.open, "f-idle"], [rk.def, "f-q"]]
    .filter(x => x[0]).map(([n, c]) => `<i class="${c}" style="flex:${n}"></i>`).join("")}</div>`;
  const tileReq = `<section class="card tile w"><span class="tk">${L.tReqs}</span>${R.total
    ? `<span class="tv">${rk.done}<small>${L.of} ${live}</small></span>${reqStack}
       <span class="ts">${[L.reqParts.done, rk.work ? L.reqParts.work(rk.work) : "", rk.open ? L.reqParts.open(rk.open) : "",
         rk.ph ? L.reqParts.ph(rk.ph) : "", rk.def ? L.reqParts.def(rk.def) : "", rk.drop ? L.reqParts.drop(rk.drop) : ""]
         .filter(Boolean).join(" · ")}</span>`
    : `<span class="tv dim">—</span><span class="ts">${L.reqLater}</span>`}</section>`;
  /* handoffs сюда не входят: передача свежему контексту — не дефект */
  const retries = T.reduce((s, t) => s + (t.retries || 0), 0), repairs = T.reduce((s, t) => s + (t.repairs || 0), 0);
  const tileTk = `<section class="card tile w"><span class="tk">${L.tTickets}</span>${T.length
    ? `<span class="tv">${done.length}<small>${L.of} ${T.length}</small></span>
       <div class="sq" aria-hidden="true">${T.map(t => `<i class="${kindOf(t).bar.replace(" stripes", "")}"></i>`).join("")}</div>
       <span class="ts">${(done.length === T.length
         ? [L.tkParts.all, repairs ? L.tkParts.repair(repairs) : "", retries ? L.tkParts.retry(retries) : ""]
         : [writing.length ? L.tkParts.now(writing.length) : "", inReview.length ? L.tkParts.rev(inReview.length) : "",
            inRepair.length ? L.tkParts.fix(inRepair.length) : "", failedT.length ? L.tkParts.bad(failedT.length) : ""])
         .filter(Boolean).join(" · ") || L.leadIdle}</span>`
    : `<span class="tv dim">${t0 ? `<span style="font-size:.6em">${L.noSplit}</span>` : "—"}</span><span class="ts">${t0 ? "" : L.tkLater}</span>`}</section>`;
  const lastDone = done.filter(t => t.tests).sort((a, b) => (toMs(a.finishedAt) || 0) - (toMs(b.finishedAt) || 0)).pop();
  const tests = S.tests || (sp && sp.tests) || (lastDone && lastDone.tests) || null;
  const tileTests = `<section class="card tile w"><span class="tk">${L.tTests}</span>${tests
    ? `<span class="tv">${esc(tests.passed || 0)}</span><span class="okb ${tests.failed ? "f-bad" : "f-done"}">${ic(tests.failed ? "x" : "check", "xs")}${
        tests.failed ? L.testsBad(esc(tests.failed)) : L.testsOk}</span><span class="ts">${fin ? L.testsFinal : L.testsSub}</span>`
    : `<span class="tv dim">—</span><span class="ts">${L.testsLater}</span>`}</section>`;
  /* blind до 10.2026 писался в свободной форме, поэтому читается терпимо: счёт — только если есть оба числа */
  const B = S.blind && typeof S.blind === "object" ? S.blind : null;
  const bText = x => typeof x === "string" ? x : (x && (x.issue || x.requirement || x.text)) || JSON.stringify(x);
  const miss = B ? [].concat(B.mismatches || (Array.isArray(B.discrepancies) ? B.discrepancies : [])).map(bText) : [];
  const counted = !!B && B.matched != null && B.checked != null && isFinite(B.matched) && isFinite(B.checked);
  const verdict = B && typeof B.verdict === "string" ? B.verdict : (B && typeof B.note === "string" ? B.note : "");
  const blindRan = !!B && B.done !== false;
  const bBig = counted ? `${esc(B.matched)}<small>${L.of} ${esc(B.checked)}</small>` : esc(miss.length);
  const tile4 = fin && blindRan
    ? `<section class="card tile w"><span class="tk">${L.tBlind}</span><span class="tv">${bBig}</span>
        ${counted ? `<div class="stack" aria-hidden="true"><i class="f-done" style="flex:${+B.matched || 0}"></i><i class="f-now" style="flex:${Math.max(0, (+B.checked || 0) - (+B.matched || 0))}"></i></div>` : ""}
        <span class="ts">${L.blindSub(miss.length)}</span></section>`
    : `<section class="card tile w"><span class="tk">${L.tTime}</span><span class="tv">${S.startedAt ? timerHTML(S.startedAt, S.finishedAt) : "—"}</span>
        <span class="ts">${L.timeSub}${median ? " · " + L.median(median) : ""}</span></section>`;

  /* ---------- ход работы ----------
     Полоса показывает СОСТОЯНИЕ, а не долю: заливка в списке задач всегда читается как прогресс. */
  let buildCard = "";
  if (T.length){
    const counts = {};
    T.forEach(t => { const k = kindOf(t).k; counts[k] = (counts[k] || 0) + 1; });
    const sw = {done:"f-done", now:"f-now", rev:"f-rev", fix:"f-fix", bad:"f-bad", wait:"f-wait"};
    const legend = ["done", "now", "rev", "fix", "bad", "wait"].filter(k => counts[k]).map(k =>
      `<span class="lg"><i class="${sw[k]}"></i>${L.kinds[k]} <b>${counts[k]}</b></span>`).join("");
    const waves = [...new Set(T.map(t => t.wave ?? 1))].sort((a, b) => a - b);
    const rows = waves.map(w => {
      const inWave = T.filter(t => (t.wave ?? 1) === w)
        .sort((a, b) => String(a.id).localeCompare(String(b.id), undefined, {numeric:true}));
      const blockers = [...new Set(inWave.flatMap(t => t.blockedBy || []))].filter(b => byId[b] && byId[b].status !== "done");
      const sub = inWave.every(t => t.status === "pending") && blockers.length ? L.waveWaits(blockers)
        : inWave.length > 1 ? L.waveSub(inWave.length) : "";
      return `<div class="wave">${L.wave(w)}${sub ? ` <span>${sub}</span>` : ""}</div>` + inWave.map(t => {
        const k = kindOf(t);
        const time = t.status === "done" ? fmtDur(mins(t))
          : (t.startedAt && t.status !== "pending") ? timerHTML(t.startedAt, t.finishedAt) : "—";
        const rf = t.repairFindings || [];
        const note = t.status === "repair" && rf.length ? ["fix", L.noteRepair(rf[rf.length - 1])]
          : t.status === "failed" && (t.concerns || []).length ? ["bad", t.concerns.join("; ")] : null;
        const extra = t.status === "done" && (t.repairs || t.retries)
          ? " · " + [t.repairs ? L.tkParts.repair(t.repairs) : "", t.retries ? L.tkParts.retry(t.retries) : ""].filter(Boolean).join(" · ") : "";
        return `<div class="tl"><span class="tl-id${k.on ? " on" : ""}">${esc(t.id)}</span>
          <div class="bar ${k.bar}" title="${esc(t.title)}"><span class="nm">${esc(t.title)}</span>
            <span class="chipin">${ic(k.icon, "xs")}<span class="lbl">${L.chip[k.k]}${extra}</span></span></div>
          <span class="tl-time ${k.on ? k.k : ""}">${time}</span>
          ${note ? `<div class="tl-note ${note[0]}">${ic(k.icon)}<span>${esc(note[1])}</span></div>` : ""}</div>`;
      }).join("");
    }).join("");
    buildCard = `<section class="card w"><div class="whead"><h3 class="wt">${L.build}</h3><div class="legend">${legend}</div></div>${rows}</section>`;
  } else if (t0 && sp){
    buildCard = `<section class="card w"><div class="whead"><h3 class="wt">${L.build}</h3><span>${timerHTML(sp.startedAt, sp.finishedAt)}</span></div>` +
      `<div class="empty">${ic("list", "m")}<span>${L.single((sp.files || []).length, sp.commit ? esc(sp.commit) : "")}</span></div></section>`;
  } else if (!fin){
    buildCard = `<section class="card w"><div class="whead"><h3 class="wt">${L.build}</h3></div><div class="empty">${ic("list", "m")}<span>${L.noTickets}</span></div></section>`;
  }

  /* ---------- списки ---------- */
  const list = (key, arr, n, fmt) => {
    if (!arr || !arr.length) return "";
    const open = UI.open[key], shown = open ? arr : arr.slice(0, n);
    return `<ul class="nl n0">${shown.map(x => `<li>${fmt ? fmt(x) : esc(x)}</li>`).join("")}</ul>` + (arr.length > n
      ? `<button type="button" class="btn-soft" data-more="${key}">${open ? L.collapse + ic("up") : L.more(arr.length - n) + ic("chev")}</button>` : "");
  };
  /* «файл:строка — суть» и «R05 — суть»: адрес серым моноширинным, суть обычным текстом */
  const located = x => {
    const m = /^(\S+?(?::\d+[\w,-]*|\.\w+)|[RGA]\d+[\w.]*)\s+[—–-]\s+(.*)$/.exec(String(x));
    return m ? `<span class="mono" style="font-size:.9em;color:var(--mut)">${esc(m[1])}</span> — ${esc(m[2])}` : esc(x);
  };
  const keysBlock = env.length ? `<div class="need"><div class="nh">${L.envKeys}<span>${env.length}</span></div>
      <div class="keys">${env.map(k => `<code class="key">${esc(k)}</code>`).join("")}</div></div>` : "";
  const phBlock = ph.length ? `<div class="need"><div class="nh">${L.placeholders}<span>${ph.length}</span></div>${list("ph", ph, 3, located)}</div>` : "";
  const asmBlock = asm.length ? `<div class="need"><div class="nh">${L.assumptions}<span>${asm.length}</span></div>${list("asm", asm, 3)}</div>` : "";
  const needCard = fin
    ? (env.length || ph.length ? `<section class="card prep w"><div class="whead"><h3 class="wt"><i>${ic("flag")}</i>${L.prep}</h3><span>${env.length + ph.length}</span></div>${keysBlock}${phBlock}</section>` : "")
    : `<section class="card w"><div class="whead"><h3 class="wt">${L.need}</h3></div>${keysBlock + phBlock + asmBlock
        || `<p class="muted">${L.needEmpty}</p>`}</section>`;
  const asmCard = fin && asm.length ? `<section class="card w"><div class="whead"><h3 class="wt">${L.assumptions}</h3><span>${asm.length}</span></div>${list("asm", asm, 3)}</section>` : "";
  const concerns = S.concerns || [], additions = S.additions || [];
  const concernsCard = concerns.length ? `<section class="card w"><div class="whead"><h3 class="wt">${L.concerns}</h3><span>${concerns.length}</span></div>
      <p class="muted" style="margin-bottom:8px">${L.concernsNote}</p>${list("concerns", concerns, 3, located)}</section>` : "";
  const addCard = additions.length ? `<section class="card w"><div class="whead"><h3 class="wt">${L.additions}</h3><span>${additions.length}</span></div>${list("add", additions, 3)}</section>` : "";
  const blindCard = B ? `<section class="card w"><div class="whead"><h3 class="wt">${L.blind}</h3></div>
      <div class="blind-top">${counted ? `<b>${bBig}</b>` : ""}<p>${blindRan ? L.blindNote : ""} ${verdict ? esc(verdict.replace(/[.;:!]?\s*$/, ".")) : ""}${blindRan ? " " + (miss.length ? L.blindBad : L.blindOk) : ""}</p></div>
      ${miss.map(m => `<div class="req"><p>${located(m)}</p></div>`).join("")}</section>` : "";
  const rounds = (S.polish && S.polish.rounds) || [];
  const polishCard = S.polish ? `<section class="card w"><div class="whead"><h3 class="wt">${L.polish}</h3></div>
      <p class="muted">${L.polishSub(rounds.length, rounds.reduce((n, r) => n + (r.accepted || 0), 0))}</p></section>` : "";

  /* ---------- проверки ----------
     Отдельного поля нет: этап не закрывается, пока его гейт не прошёл, поэтому G1 и G3 читаются
     по этапам брифинга и плана, G2 — по coverage, G4 — по blind. */
  const gate = (id, cls, icon, sub) => `<div class="gate"><span class="gi ${cls}">${ic(icon, "xs")}</span><div><div class="gt">${L.gT[id]}</div><div class="gs">${sub}</div></div><span class="gk">${id}</span></div>`;
  const later = (id, sub) => gate(id, "wait", "clock", fin ? L.gNone : sub);
  const passed = st => st && (st.status === "done" || st.status === "skipped");
  const okG = {};
  const sb = stage("briefing"), ss = stage("spec"), spl = stage("plan");
  const g1 = passed(sb) ? (okG.G1 = 1, gate("G1", "ok", "check", sb.note ? esc(sb.note) : L.g1ok))
    : sb.status === "failed" ? gate("G1", "bad", "x", L.gFail)
    : waiting && waiting.kind === "briefing" ? gate("G1", "warn", "msg", L.g1ask) : later("G1", L.g1later);
  const C = S.coverage;
  const g2 = C ? (okG.G2 = 1, gate("G2", "ok", "check", L.g2(+C.found || 0, +C.fixed || 0, +C.deferred || 0)))
    : ss.status === "done" ? gate("G2", "warn", "alert", L.g2miss) : later("G2", L.g2later);
  const g3 = spl.status === "done" && T.length ? (okG.G3 = 1, gate("G3", "ok", "check", L.g3ok(live, T.length)))
    : spl.status === "skipped" && t0 ? (okG.G3 = 1, gate("G3", "ok", "check", L.g3t0))
    : spl.status === "failed" ? gate("G3", "bad", "x", L.gFail) : later("G3", L.g3later);
  const g4sub = n => counted ? L.g4(esc(B.matched), esc(B.checked), n) : esc(verdict) || L.blindSub(n);
  const g4 = !B ? later("G4", L.g4later) : !blindRan ? gate("G4", "wait", "clock", esc(verdict) || L.gNone)
    : miss.length ? gate("G4", "warn", "alert", g4sub(miss.length)) : (okG.G4 = 1, gate("G4", "ok", "check", g4sub(0)));
  const gatesCard = `<section class="card w"><div class="whead"><h3 class="wt">${L.gates}</h3><span>${L.gatesOf(Object.keys(okG).length)}</span></div>${g1}${g2}${g3}${g4}</section>`;

  /* ---------- расход ----------
     Числа считает tools/usage.py по транскриптам; нет usage.js — нет и карточки, нулей не рисуем. */
  const U = window.USAGE && window.USAGE.total ? window.USAGE : null;
  let usageCard = "";
  if (U){
    const num = (v, d) => v.toLocaleString(L.locale, {maximumFractionDigits:d});
    const tok = n => n >= 1e9 ? `${num(n / 1e9, 2)}<small> ${L.tokB}</small>`
      : n >= 1e6 ? `${num(n / 1e6, n < 1e7 ? 2 : 1)}<small> ${L.tokM}</small>`
      : n >= 1e3 ? `${num(n / 1e3, n < 1e4 ? 1 : 0)}<small> ${L.tokK}</small>` : num(n, 0);
    const usd = v => "$" + num(v || 0, v < 10 ? 2 : 0);
    const tt = U.total, inAll = (tt.input || 0) + (tt.cacheRead || 0) + (tt.cacheWrite || 0);
    const ul = U.lead || {}, ag = U.agents || {};
    const row = (k, v, sub) => `<div class="use"><span class="gt">${k}</span><b>${v}</b>${sub ? `<span class="gs">${sub}</span>` : ""}</div>`;
    usageCard = `<section class="card w"><div class="whead"><h3 class="wt">${L.usage}</h3><span>${L.useReq(tt.requests || 0)}</span></div>
      ${row(L.useIn, tok(inAll), inAll ? L.useInSub(Math.round((tt.cacheRead || 0) / inAll * 100)) : "")}
      ${row(L.useOut, tok(tt.output || 0), L.useOutSub)}
      ${row(L.useUsd, "≈ " + usd(tt.usd), ag.requests ? L.useSplit(usd(ul.usd), usd(ag.usd), ag.count || 0) : "")}
      <p class="muted">${L.useNote(hhmm(U.updatedAt))}${(U.unpriced || []).length ? " " + L.useUnpriced(esc(U.unpriced.join(", "))) : ""}</p></section>`;
  }

  /* ---------- лента ----------
     Собирается из отметок, которые и так лежат в state.js: отдельного журнала событий нет. */
  const E = [];
  const ev = (t, text, cls, icon) => { if (toMs(t) != null) E.push({t, text, cls, icon}); };
  ev(S.startedAt, L.ev.init, "", "play");
  stages.forEach(s => {
    const n = stName(s);
    if (s.status !== "pending" && s.startedAt) ev(s.startedAt, L.ev.stage.start(n), "", "play");
    if (s.status === "done") ev(s.finishedAt, L.ev.stage.done(n, s.note), "f-done", "check");
    if (s.status === "skipped") ev(s.finishedAt || s.startedAt, L.ev.stage.skip(n, s.note), "", "chev");
    if (s.status === "failed") ev(s.finishedAt || s.startedAt, L.ev.stage.fail(n, s.note), "f-bad", "x");
  });
  const starts = {};
  T.forEach(t => { if (t.startedAt) (starts[t.startedAt] = starts[t.startedAt] || []).push(t.id); });
  Object.keys(starts).forEach(at => ev(at, L.ev.start(starts[at]), "", "play"));
  T.forEach(t => {
    if (t.status === "done") ev(t.finishedAt, L.ev.done(t.id, t.tests), "f-done", "check");
    if (t.status === "failed") ev(t.finishedAt || t.startedAt, L.ev.fail(t.id), "f-bad", "x");
  });
  (S.waits || []).forEach(w => { ev(w.from, L.ev.ask(w.note), "f-now", "msg"); ev(w.to, L.ev.answered, "", "msg"); });
  if (waiting) ev(waiting.since, L.ev.ask(waiting.note), "f-now", "msg");
  if (fin) ev(S.finishedAt, L.ev.finish, "f-done", "flag");
  const feedRows = E.sort((a, b) => toMs(b.t) - toMs(a.t)).slice(0, 12).map(e =>
    `<div class="ev"><span class="ei ${e.cls}">${ic(e.icon, "xs")}</span><span>${esc(e.text)}</span>${
      fin ? `<em>${hhmm(e.t)}</em>` : `<em data-ago-short="${esc(e.t)}">${agoShort(e.t)}</em>`}</div>`).join("");
  const feedCard = feedRows ? `<section class="card w"><div class="whead"><h3 class="wt">${L.feed}</h3>${fin ? "" :
    `<span data-ago="${esc(S.updatedAt || "")}">${S.updatedAt ? agoText(S.updatedAt) : ""}</span>`}</div>${feedRows}</section>` : "";

  /* ---------- раскладка ---------- */
  const leftCol = fin ? [needCard, blindCard, buildCard, polishCard] : [needCard, addCard, polishCard];
  const rightCol = fin ? [gatesCard, usageCard, asmCard, concernsCard, addCard, feedCard] : [gatesCard, usageCard, feedCard, concernsCard];
  const fmtDay = iso => new Date(iso).toLocaleString(L.locale, {day:"numeric", month:"long", hour:"2-digit", minute:"2-digit"});
  const when = S.startedAt ? (fin ? L.startedRange(fmtDay(S.startedAt), hhmm(S.finishedAt))
    : L.started(new Date(S.startedAt).toDateString() === new Date().toDateString() ? `${L.today} ${hhmm(S.startedAt)}` : fmtDay(S.startedAt))) : "";
  const tags = [S.prd, S.mode && (L.modes[S.mode] || S.mode), S.depth && (L.depths[S.depth] || S.depth),
    S.tier && L.tier(S.tier), S.polish && L.polishTag].filter(Boolean).map(x => `<span class="tag">${esc(x)}</span>`).join("");
  const th = effectiveTheme();

  document.documentElement.lang = L.lang;
  const app = document.getElementById("app");
  app.innerHTML = `
  <header class="top">
    <div class="mark">PRD</div>
    <div class="tools">
      ${fin ? "" : `<button type="button" class="iconbtn" data-refresh title="${L.refresh}" aria-label="${L.refresh}">${ic("sync")}</button>`}
      <div class="tabs" role="group" aria-label="${L.themeLabel}">
        <button type="button" data-theme="light" title="${L.themeLight}" aria-label="${L.themeLight}" aria-pressed="${th === "light"}">${ic("sun")}</button>
        <button type="button" data-theme="dark" title="${L.themeDark}" aria-label="${L.themeDark}" aria-pressed="${th === "dark"}">${ic("moon")}</button>
      </div>
      <div class="tabs" role="group" aria-label="${L.langLabel}">
        <button type="button" data-lang="ru" aria-pressed="${L.lang === "ru"}">RU</button>
        <button type="button" data-lang="en" aria-pressed="${L.lang === "en"}">EN</button>
      </div>
    </div>
  </header>
  <div class="title">
    <h1>${esc(S.title || S.slug || "")}</h1>
    <div class="meta">${tags}<span class="when">${when}</span></div>
  </div>
  ${hero}
  <div class="tiles">${tileReq}${tileTk}${tileTests}${tile4}</div>
  ${fin ? "" : buildCard}
  <div class="cols"><div class="col">${leftCol.join("")}</div><div class="col">${rightCol.join("")}</div></div>
  <footer>
    <span>${[S.docsPath ? `${L.filesIn} <code>${esc(S.docsPath)}</code>` : "",
      S.codeBranch ? `${L.branch} <code>${esc(S.codeBranch)}</code>` : "",
      /^https?:\/\//.test(S.stand || "") ? `<a href="${esc(S.stand)}" target="_blank" rel="noopener">${L.stand}</a>` : ""]
      .filter(Boolean).join(" · ")}</span>
    <span>${fin ? L.frozen : `${L.updated}: <span data-ago="${esc(S.updatedAt || "")}">${S.updatedAt ? agoText(S.updatedAt) : "—"}</span>`}</span>
  </footer>`;

  /* вкладку видно и тогда, когда дашборд в фоне */
  document.title = (waiting ? L.tabWait + " — " : "") + (S.title ? `${S.title} — prd` : "prd");

  if (!booted){
    booted = true;
    app.classList.add("boot");
    setTimeout(() => app.classList.remove("boot"), 1400);
  }
  tick();
  showLink();
  if (!pulling) pollState();
}

/* Пустой экран не говорит, что сломалось, — поэтому страница объясняет и продолжает опрос. */
function bootFail(why){
  const L = CUR;
  document.getElementById("app").innerHTML = `<header class="top"><div class="mark">PRD</div></header>
    <section class="card"><h3 class="wt">${L.boot}</h3><p class="muted" style="margin-top:10px">${why}</p>
    <p class="muted" style="margin-top:10px">${L.bootHelp}</p></section>`;
}

/* Один обработчик на всё: #app переписывается целиком на каждом событии. */
document.getElementById("app").addEventListener("click", e => {
  const b = e.target.closest("button");
  if (!b) return;
  if (b.dataset.lang){
    CUR = I18N[b.dataset.lang];
    store("prd-lang", b.dataset.lang);
    if (window.STATE) render();
  } else if (b.dataset.theme){
    /* повторный клик по выбранной теме возвращает системную */
    store("prd-theme", storedTheme() === b.dataset.theme ? null : b.dataset.theme);
    applyTheme();
    document.querySelectorAll("button[data-theme]").forEach(x =>
      x.setAttribute("aria-pressed", String(x.dataset.theme === effectiveTheme())));
  } else if (b.hasAttribute("data-refresh")){
    refreshNow(b);
  } else if (b.dataset.more){
    UI.open[b.dataset.more] = !UI.open[b.dataset.more];
    render();
  }
});

applyTheme();
if (!window.STATE || typeof window.STATE !== "object"){
  bootFail(CUR.bootWhy);
  pollState();
} else {
  try { render(); lastStamp = stampOf(window.STATE); }
  catch (e) { bootFail(esc(String(e && e.message || e))); pollState(); }
}
setInterval(tick, 1000);
/* После сна компьютера таймеры страницы стояли — не ждём очередного круга опроса. */
document.addEventListener("visibilitychange", () => { if (!document.hidden){ tick(); refreshNow(); } });
window.addEventListener("pageshow", e => { if (e.persisted){ tick(); refreshNow(); } });
try {
  matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => {
    if (storedTheme()) return;
    document.querySelectorAll("button[data-theme]").forEach(x =>
      x.setAttribute("aria-pressed", String(x.dataset.theme === effectiveTheme())));
  });
} catch (e) {}
</script>
</body>
</html>
